<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
<title id="title">Jumon — Commands for Phoenix</title>
<desc id="description">A command box with a prompt and a cursor, in Sumi ink and blade orange. Cormorant Garamond wordmark and Outfit supporting text.</desc>
<rect width="1600" height="800" fill="#f5f0e8"/>
<g transform="translate(270 254) scale(2.2)"><defs>
  <mask id="command-box" maskUnits="userSpaceOnUse" x="0" y="0" width="112" height="112">
    <rect width="112" height="112" fill="white"/>
    <path d="M36 41L51 56L36 71" fill="none" stroke="black" stroke-width="3.5"/>
  </mask>
</defs>
<g mask="url(#command-box)">
  <path fill="#0a0a0b" d="M26 16H86Q96 16 96 26V86Q96 96 86 96H26Q16 96 16 86V26Q16 16 26 16Z"/>
  <rect fill="#e84a1c" x="58" y="66" width="20" height="5"/>
</g></g>
<path d="M128 109H160" fill="none" stroke="#e84a1c" stroke-width="2"/>
<style>@font-face{font-family:'Jumon display';font-weight:300;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Jumon body';font-weight:300;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Jumon label';font-weight:500;src:url(data:font/woff;base64,) format('woff')}</style>
<!-- xml:lang="nl": the Dutch form of Cormorant's J, which does not descend into the line below. -->
<text x="558" y="423" xml:lang="nl" font-family="Jumon display" font-weight="300" font-size="160" letter-spacing="19.2" fill="#0a0a0b">JUMON</text>
<text x="565" y="484" font-family="Jumon body" font-weight="300" font-size="28" letter-spacing="0" fill="#0a0a0b">Commands for Phoenix.</text>
<text x="181" y="115" font-family="Jumon label" font-weight="500" font-size="16" letter-spacing="3.2" fill="#0a0a0b">HATTORI AI</text>
</svg>
